services:
  icost:
    build: .
    image: icost-app:latest
    container_name: icost-app
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "${ICOST_PORT:-3000}:3000"
    environment:
      DATABASE_URL: file:/app/database/db.sqlite
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in the NAS .env file}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in the NAS .env file}
      IMPORT_INBOX_DIR: /app/imports
      TZ: ${TZ:-America/New_York}
    volumes:
      - ${ICOST_DATABASE_DIR:-./database}:/app/database
      # Replace ./imports with an absolute UGREEN NAS folder if preferred.
      - ${ICOST_IMPORT_DIR:-./imports}:/app/imports
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true
